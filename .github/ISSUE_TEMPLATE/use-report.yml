{
  "name": "Use report / 使用反馈",
  "description": "Tell us about an actual task and the corrections it needed.",
  "title": "[Use report] ",
  "body": [
    {
      "type": "textarea",
      "id": "task",
      "attributes": {
        "label": "Which kind of quote did you prepare?",
        "description": "Include currency, line count and rounding policy; omit private client details."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "result",
      "attributes": {
        "label": "Did the quote match your independently calculated amounts?",
        "description": "Describe any discrepancy, client mapping issue or layout correction."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "Agent/model, OS, Python and commit/version"
      }
    },
    {
      "type": "dropdown",
      "id": "repeat",
      "attributes": {
        "label": "Would you use it for another task?",
        "options": [
          "Yes",
          "With the changes above",
          "No",
          "Not sure"
        ]
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I removed secrets, private client data and unredacted personal information.",
            "required": true
          }
        ]
      }
    }
  ]
}
